name: Android build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build test APK on main
        if: github.ref_type == 'branch'
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload test APK
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: ncm-profile-fix-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Derive APK version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH, e.g. v0.1.0"
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if ((minor >= 1000 || patch >= 1000)); then
            echo "::error::Minor and patch numbers must be below 1000"
            exit 1
          fi
          version_code=$((major * 1000000 + minor * 1000 + patch + 1))
          if ((version_code > 2100000000)); then
            echo "::error::Android versionCode limit exceeded"
            exit 1
          fi
          echo "NCM_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "NCM_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Restore persistent signing key
        if: github.ref_type == 'tag' || env.HAS_SIGNING_SECRETS == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing Actions Secret: $key"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ncm-release.p12"
          test -s "$RUNNER_TEMP/ncm-release.p12"
          echo "NCM_KEYSTORE_FILE=$RUNNER_TEMP/ncm-release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: github.ref_type == 'tag' || env.HAS_SIGNING_SECRETS == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify signed APK and prepare release assets
        if: github.ref_type == 'tag' || env.HAS_SIGNING_SECRETS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$source_apk"
          mkdir -p release_assets
          name="${NCM_VERSION_NAME:-0.1.0}"
          cp "$source_apk" "release_assets/NCM-Profile-Fix-v${name}.apk"
          (cd release_assets && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload signed release artifact
        if: github.ref_type == 'tag' || env.HAS_SIGNING_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ncm-profile-fix-release-signed
          path: release_assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release_assets/NCM-Profile-Fix-v*.apk
            release_assets/SHA256SUMS.txt
